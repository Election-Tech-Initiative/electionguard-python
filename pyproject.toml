[project]
name = "electionguard"
version = "1.4.0"
requires-python = ">=3.11,<4.0.0"
description = "ElectionGuard: Support for e2e verified elections."
license = "MIT"
authors = [{"name" = "Microsoft", "email" = "electionguard@microsoft.com"}]
maintainers = []
readme = "README.md"
keywords = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Topic :: Utilities"
]
dependencies = [
  "gmpy2>=2.3.2,<3.0.0",
  "psutil>=7.2.2",
  "pydantic>=2.14.3,<3.0.0",
  "click>=8.5.1,<9.0.0",
  "dacite>=1.9.2,<2.0.0",
  "python-dateutil>=4.0.0,<5.0.0",
    "Eel[jinja2]>=0.18.2,<1.0.0",
  "pymongo>=4.19.0,<5.0.0",
  "dependency-injector>=4.49.1,<5.0.0",
  # electionguard_tools (used by the eg CLI) builds ballots with hypothesis strategies
  "hypothesis>=6.170.15",
]

[project.urls]
homepage = "https://Election-Tech-Initiative.github.io/electionguard-python"
repository = "https://github.com/Election-Tech-Initiative/electionguard-python"
documentation = "https://Election-Tech-Initiative.github.io/electionguard-python"
"GitHub Pages" = "https://Election-Tech-Initiative.github.io/electionguard-python"
"Read the Docs" = "https://electionguard-python.readthedocs.io"
"Releases" = "https://github.com/Election-Tech-Initiative/electionguard-python/releases"
"Milestones" = "https://github.com/Election-Tech-Initiative/electionguard-python/milestones"
"Issue Tracker" = "https://github.com/Election-Tech-Initiative/electionguard-python/issues"

[dependency-groups]
dev = [
  "atomicwrites",
  "black==26.10.1",
  "coverage>=7.17.2",
  "docutils",
  "ipykernel>=7.4.0,<8.0.0",
  "ipython>=9.18.1,<10.0.0",
  "jeepney",
  "jupyter-black>=0.4.0,<0.5.0",
  "mkdocs>=1.6.1,<2.0.0",
  "mkdocs-jupyter>=0.26.3,<0.28.0",
  "mkinit",
  "mypy==2.4.1",
  "pydeps",
  "pylint>=4.1.3",
  "pytest>=9.2.0",
  "pytest-mock>=3.17.0",
  "types-python-dateutil>=2.9.0.20261104",
  "secretstorage",
  "twine",
  "typish",
]

[project.scripts]
eg = 'electionguard_cli.start:cli'
egui = 'electionguard_gui.start:run'

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["electionguard", "electionguard_cli", "electionguard_gui", "electionguard_tools"]

[tool.pytest.ini_options]
filterwarnings = [
  # This hides the warnings rather than fixing them: eel 0.18.2 uses names pyparsing has
  # deprecated, and only eel can change that. Remove this once eel stops using them.
  "ignore:.*deprecated.*:DeprecationWarning:eel",
]

[tool.black]
target-version = ['py311']

[tool.pylint.basic]
extension-pkg-whitelist = "pydantic"

[tool.pylint.format]
max-line-length = 120

# FIXME: Pylint should not require this many exceptions
# cyclic-import, import-self: pylint 4.1 false positives on mkinit __init__ files whose submodule names start with the package name
[tool.pylint.messages_control]
disable = '''
  cyclic-import,
  duplicate-code,
  fixme,
  import-self,
  invalid-name,
  missing-module-docstring,
  missing-function-docstring,
  no-value-for-parameter,
  redefined-builtin,
  broad-exception-raised,
  too-few-public-methods,
  too-many-arguments,
  too-many-branches,
  too-many-function-args,
  too-many-lines,
  too-many-locals,
  too-many-nested-blocks,
  too-many-positional-arguments,
  unnecessary-lambda,
  '''

[tool.coverage.run]
branch = true
source = ["src/electionguard"]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
show_column_numbers = true
